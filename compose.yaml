name: dmz-wiki

x-wiki: &wiki
  image: ${DMZ_IMAGE:-ghcr.io/dragonminez/dragonminez-wiki:latest}
  pull_policy: always
  restart: unless-stopped
  env_file: .env
  environment:
    MW_DATA_DIR: /var/www/data
    MW_SECRETS_FILE: /var/www/secrets/secrets.php
    MW_LOCAL_SETTINGS: /var/www/secrets/LocalSettings.local.php
  volumes:
    - ${DMZ_DATA_DIR:-./data}/db:/var/www/data
    - ${DMZ_DATA_DIR:-./data}/images:/var/www/html/images
    - ${DMZ_DATA_DIR:-./data}/secrets:/var/www/secrets:ro
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  wiki:
    <<: *wiki
    # Local/cloudflared: descomentar para publicar en el host.
    # ports:
    #   - "127.0.0.1:${WIKI_PORT:-8091}:80"
    # Dokploy: Traefik llega por esta red (dominio -> servicio wiki, puerto 80).
    networks:
      - default
      - dokploy-network
    mem_limit: 768m
    memswap_limit: 1g
    cpus: 1.5
    # Traefik: dragonminez.com/wiki comes here (the longer rule wins over the website's Host rule), and the old
    # wiki.dragonminez.com redirects permanently to the same page under dragonminez.com/wiki.
    labels:
      traefik.enable: "true"
      traefik.docker.network: dokploy-network
      traefik.http.services.dmzwiki.loadbalancer.server.port: "80"
      traefik.http.routers.dmzwiki.rule: Host(`dragonminez.com`) && PathPrefix(`/wiki`)
      traefik.http.routers.dmzwiki.entrypoints: websecure
      traefik.http.routers.dmzwiki.tls.certresolver: letsencrypt
      traefik.http.routers.dmzwiki.service: dmzwiki
      traefik.http.routers.dmzwiki-http.rule: Host(`dragonminez.com`) && PathPrefix(`/wiki`)
      traefik.http.routers.dmzwiki-http.entrypoints: web
      traefik.http.routers.dmzwiki-http.middlewares: dmzwiki-https
      traefik.http.routers.dmzwiki-http.service: dmzwiki
      traefik.http.middlewares.dmzwiki-https.redirectscheme.scheme: https
      traefik.http.middlewares.dmzwiki-https.redirectscheme.permanent: "true"
      # API, scripts and files on the old host keep working: they move to /wiki/w, not to a page title.
      traefik.http.routers.dmzwiki-old-w.rule: Host(`wiki.dragonminez.com`) && (PathPrefix(`/api.php`) || PathPrefix(`/index.php`) || PathPrefix(`/load.php`) || PathPrefix(`/rest.php`) || PathPrefix(`/images/`))
      traefik.http.routers.dmzwiki-old-w.priority: "10001"
      traefik.http.routers.dmzwiki-old-w.entrypoints: web,websecure
      traefik.http.routers.dmzwiki-old-w.tls.certresolver: letsencrypt
      traefik.http.routers.dmzwiki-old-w.middlewares: dmzwiki-moved-w
      traefik.http.routers.dmzwiki-old-w.service: dmzwiki
      traefik.http.middlewares.dmzwiki-moved-w.redirectregex.regex: ^https?://wiki\.dragonminez\.com/(.*)
      traefik.http.middlewares.dmzwiki-moved-w.redirectregex.replacement: https://dragonminez.com/wiki/w/$${1}
      traefik.http.middlewares.dmzwiki-moved-w.redirectregex.permanent: "true"
      traefik.http.routers.dmzwiki-old.rule: Host(`wiki.dragonminez.com`)
      traefik.http.routers.dmzwiki-old.priority: "10000"
      traefik.http.routers.dmzwiki-old.entrypoints: web,websecure
      traefik.http.routers.dmzwiki-old.tls.certresolver: letsencrypt
      traefik.http.routers.dmzwiki-old.middlewares: dmzwiki-moved
      traefik.http.routers.dmzwiki-old.service: dmzwiki
      traefik.http.middlewares.dmzwiki-moved.redirectregex.regex: ^https?://wiki\.dragonminez\.com/(?:wiki/)?(.*)
      traefik.http.middlewares.dmzwiki-moved.redirectregex.replacement: https://dragonminez.com/wiki/$${1}
      traefik.http.middlewares.dmzwiki-moved.redirectregex.permanent: "true"

  jobrunner:
    <<: *wiki
    user: www-data
    depends_on:
      - wiki
    entrypoint: ["/usr/local/bin/dmz-jobrunner"]
    mem_limit: 256m
    memswap_limit: 384m
    cpus: 0.5

networks:
  dokploy-network:
    external: true
