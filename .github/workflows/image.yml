name: Build image

on:
  push:
    branches: [main]
    paths:
      - docker/**
      - skins/**
      - extensions/**
      - config/**
      - compose.yaml
      - scripts/vps-deploy.sh
      - .github/workflows/image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/dragonminez/dragonminez-wiki

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          pull: true
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to the VPS
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          DMZ_VPS_HOST: ${{ vars.DMZ_VPS_HOST }}
          DMZ_VPS_PORT: ${{ vars.DMZ_VPS_PORT }}
          WIKI_DEPLOY_KEY: ${{ secrets.WIKI_DEPLOY_KEY }}
          DMZ_VPS_KNOWN_HOSTS: ${{ secrets.DMZ_VPS_KNOWN_HOSTS }}
        run: |
          if [ -z "$WIKI_DEPLOY_KEY" ]; then
            echo "::warning::WIKI_DEPLOY_KEY is not set: the image is built but not deployed (docs/SERVER.md, Despliegue sin Dokploy)."
            exit 0
          fi
          : "${DMZ_VPS_HOST:?DMZ_VPS_HOST variable is required}"
          : "${DMZ_VPS_KNOWN_HOSTS:?DMZ_VPS_KNOWN_HOSTS secret is required}"
          port="${DMZ_VPS_PORT:-22}"
          install -m 700 -d ~/.ssh
          echo "$WIKI_DEPLOY_KEY" > ~/.ssh/wiki_deploy_key
          chmod 600 ~/.ssh/wiki_deploy_key
          echo "$DMZ_VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The key is locked to one command on the server (scripts/vps-deploy.sh); the word after the host is ignored.
          ssh -i ~/.ssh/wiki_deploy_key -p "$port" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes dmzweb@"$DMZ_VPS_HOST" deploy
