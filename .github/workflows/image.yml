name: Build image

on:
  push:
    branches: [main]
    paths:
      - docker/**
      - skins/**
      - extensions/**
      - config/**
      - .github/workflows/image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/dragonminez/dragonminez-wiki
  # Optional: Dokploy "Deploy webhook" URL of the compose app (repo secret).
  DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          pull: true
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Dokploy redeploy
        if: ${{ env.DOKPLOY_WEBHOOK_URL != '' }}
        run: curl -fsS -X POST "$DOKPLOY_WEBHOOK_URL"
