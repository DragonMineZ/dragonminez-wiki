name: Sync content

on:
  push:
    branches: [main]
    paths:
      - content/**
      - tools/**
      - .github/workflows/content.yml
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      full:
        description: Compare everything with the wiki and publish what differs (to catch up after a failed sync)
        type: boolean
        default: false
      dry_run:
        description: Only list what would be published
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: content
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      MW_API: ${{ vars.MW_API || 'https://wiki.dragonminez.com/api.php' }}
      MW_BOT_USER: ${{ secrets.MW_BOT_USER }}
      MW_BOT_PASSWORD: ${{ secrets.MW_BOT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check credentials
        id: creds
        run: |
          if [ -z "$MW_BOT_USER" ] || [ -z "$MW_BOT_PASSWORD" ]; then
            echo "::warning::Set the MW_BOT_USER and MW_BOT_PASSWORD repository secrets to publish content."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Find the last sync
        id: last
        run: |
          echo "started=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/wiki-synced^{commit}" > /dev/null; then
            echo "base=wiki-synced" >> "$GITHUB_OUTPUT"
            since=$(git tag -l --format='%(contents:subject)' wiki-synced)
            if [ -n "$since" ]; then
              echo "since=$(date -u -d "@$(( $(date -u -d "$since" +%s) - 600 ))" +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Bring edits made on the wiki
        if: steps.creds.outputs.ok == 'true' && !inputs.dry_run
        run: |
          python tools/pull_wiki.py --base "${{ steps.last.outputs.base }}" --since "${{ steps.last.outputs.since }}" --report wiki-edits.txt
          if [ -n "$(git status --porcelain -- content)" ]; then
            git add -A content
            git commit -q -F wiki-edits.txt
            cat wiki-edits.txt >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish pages, files and translations
        if: steps.creds.outputs.ok == 'true'
        run: |
          base="${{ steps.last.outputs.base }}"
          guard=()
          if [ -n "$base" ]; then
            guard=(--base-ref "$base")
          else
            base="${{ github.event_name == 'push' && github.event.before || 'HEAD~1' }}"
          fi
          echo "Publishing what changed since $base"
          python tools/sync_content.py --base "$base" "${guard[@]}" \
            ${{ inputs.full && '--full' || '' }} \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Save the synced state
        if: steps.creds.outputs.ok == 'true' && !inputs.dry_run
        run: |
          if [ -n "$(git status --porcelain -- content/pages)" ]; then
            git add content/pages
            git commit -q -m "chore: translation unit markers from the wiki"
          fi
          synced=$(git rev-parse HEAD)
          if [ "$(git rev-list --count "origin/${GITHUB_REF_NAME}..HEAD")" -gt 0 ]; then
            git pull --rebase -q
            git push -q
          fi
          git tag -f -a wiki-synced -m "${{ steps.last.outputs.started }}" "$synced"
          git push -f -q origin refs/tags/wiki-synced
