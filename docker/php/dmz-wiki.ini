expose_php = Off
memory_limit = 256M
max_execution_time = 60
upload_max_filesize = 20M
post_max_size = 24M
max_input_vars = 5000

opcache.memory_consumption = 96
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 12000
opcache.revalidate_freq = 60

apc.enabled = 1
apc.shm_size = 48M
apc.enable_cli = 0
